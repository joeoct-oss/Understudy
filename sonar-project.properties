# Settings for SonarQube Cloud's analysis, run first on every pull request and push to main by
# scripts/sonar-scan.sh from the checks workflow. Its quality gate must pass before any other check
# runs. The rules are "Sonar way comprehensive": bugs, security and code quality.
# - Sources and tests are kept apart, so the rules check the package's code, and the tests are
#   judged by their own rules and by review (CODE_STYLE.md).
# - Coverage lives in Codecov and in CI's gate (scripts/check-coverage.sh). Sonar runs before the
#   tests, so no file counts toward Sonar's coverage and it never reports 0%.
sonar.organization=joeoct-oss
sonar.projectKey=joeoct-oss_Understudy
# - Benchmarks/Tests is test code too, so it leaves the sources, and so do images, which aren't
#   text. The project's "automatic configuration" setting stays off in Sonar: when on, it replaces
#   these paths with its own.
sonar.sources=Sources,Package.swift,scripts,.github,Tools,Benchmarks
sonar.exclusions=Benchmarks/Tests/**,**/*.png
sonar.tests=Tests,Benchmarks/Tests
sonar.sourceEncoding=UTF-8
sonar.coverage.exclusions=**/*
# - A DocC tutorial's step files each repeat the step before and add to it, as the tutorial
#   shows them, so the catalog is left out of duplication; its code is compiled and run by the
#   guide tests in Tests/UnderstudyTests/Guides/.
sonar.cpd.exclusions=Sources/Understudy/Understudy.docc/**
sonar.python.version=3
