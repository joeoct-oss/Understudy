# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every pull request here on its free open-source plan. It adds to the
# existing review and replaces nothing. It only reviews: nothing writes commits, edits the
# PR description or comments on issues. Code style lives in CODE_STYLE.md (read through
# knowledge_base); the path instructions below only add what a reviewer can check in a diff.
language: en-US
tone_instructions: >-
  Plain, short English. Only blockers and should-fix items, each as one inline comment that
  names the rule it breaks and why. Breaking a code style rule is a should-fix item. No
  praise, no recaps, no nitpicks the code style does not ask for.
enable_free_tier: true

reviews:
  # chill, not quiet: on a probe PR, quiet folded broken style rules into the review body as
  # nitpicks, where no thread has to be resolved. The tone and path instructions keep the inline
  # comments to blockers and should-fix items.
  profile: chill
  # Facts for the merge risk and security risk ratings in each review. They only rate the PR:
  # automatic approvals are off, so they never approve or block a merge.
  merge_risk_instructions: >-
    Every merge to main publishes a release, so a merged change reaches package users at once.
    High risk: a breaking change to public API or to the code a public macro generates; a change
    to Package.swift platforms, swift-tools-version or dependencies; a change to
    .github/workflows/release.yml or scripts/release-notes.sh. Moderate risk: locking,
    concurrency or waiting code in Sources/Understudy; macro code that changes diagnostics or
    fix-its; a change to scripts/check-coverage.sh, scripts/check-structure.py or a required CI
    job. Low risk: changes only to Tests/, Sources/UnderstudySamples*, Tools/, docs or
    CHANGELOG.md that keep the generated code and messages the same.
  security_risk_instructions: >-
    Understudy is a test-only Swift package: it runs inside users' test targets and, through its
    macros, as a compiler plugin in their builds. It runs no service, stores nothing and makes no
    network calls. The trust boundaries are the macro plugin, which must only read the syntax it
    is given, and CI: the release job alone holds a contents write token and publishes tags and
    releases, and every other job is read-only. A change that gives a job more permissions,
    makes the macros read files, the environment or the network, or adds a dependency is high
    risk; source and test changes inside those limits are minimal.
  # Keep the PR description as the author wrote it. Never put "@coderabbitai summary" in it.
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  # The walkthrough comment can't be turned off, so it stays small and folded.
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  # Issues live in a private repo that CodeRabbit can't read.
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  review_status: false
  # "CodeRabbit" is a required check on main: it is pending while the review runs, and a review
  # that stops on an error fails it, so nothing merges unreviewed.
  commit_status: true
  fail_commit_status: true
  # Use "@coderabbitai configuration" to see the resolved config when needed.
  review_info: false
  # No "Prompt for AI Agents" block under every inline comment.
  enable_prompt_for_ai_agents: false
  # A maintainer reviews every PR; no automatic slop labelling.
  slop_detection:
    enabled: false
  auto_review:
    enabled: true
    drafts: false
    # Review every push; the default pauses after 5 reviewed commits.
    auto_pause_after_reviewed_commits: 0
  # Nothing pushes commits or opens pull requests on its own.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        One plain imperative sentence that says exactly what changes, with no prefix, no
        issue or ticket number and no jargon.
    # Advisory only: a breaking API change must be recorded for package users.
    custom_checks:
      - name: "Breaking change recorded"
        mode: warning
        instructions: >-
          Fail if the PR removes or renames a public or open declaration under Sources/,
          changes a public signature, argument label or default argument, removes a public
          protocol conformance, adds a protocol requirement without a default, adds a case to
          a public enum, raises a platform minimum or swift-tools-version in Package.swift,
          or changes what a public macro generates, and CHANGELOG.md gains no entry under
          Unreleased that says it is breaking. Additions alone pass.
  # Generated or build output; nothing in it is reviewable by reading.
  path_filters:
    - "!**/Package.resolved"
    - "!**/.build/**"
    - "!**/.swiftpm/**"
  path_instructions:
    # The shared code style lives in Waypoint's CODE_STYLE.md, which CodeRabbit can't read while
    # that repo is private and outside its install. This entry restates only what a reviewer can
    # check in a diff. Once Waypoint is public and CodeRabbit can read it, delete this entry and
    # add "joeoct-oss/Waypoint:CODE_STYLE.md" to knowledge_base.code_guidelines.filePatterns.
    # SonarQube Cloud's "Sonar way comprehensive" rules also check code quality, but none of the
    # rules below, so they are CodeRabbit's alone.
    - path: "**/*.swift"
      instructions: >-
        Shared code style. Report each broken rule as an inline should-fix finding (major
        severity) that names the rule, never as a nitpick or trivial item: this package has no
        linter, so review is the only check. Empty braces have one space
        inside, `{ }`, never `{}` (empty collection literals and braces inside string literals or
        test source fixtures are not braces). A type or extension with members opens its brace on
        the declaration line, puts each member on its own line and lists one enum case per line.
        Every body (function, initializer, accessor, if, guard, for, switch, do, catch, defer)
        goes on its own lines; only `{ }`, `{ get }`-style accessor listings and a closure
        argument whose body is one short expression may stay on one line. A blank line separates
        member groups (stored properties, initializers, functions, nested types) and every member
        with a body; members without a body may sit together. Members come in this order: enum
        cases, type aliases and associated types, nested types, static properties, stored
        properties, computed properties, initializers and deinit, static functions, functions
        and subscripts. Within one type either every member has a `///` doc comment or none
        does; public API documents every member. Comment lines (`//` and `///`) end by column
        100, code lines by 120; a URL may run long. A parameter list or call that doesn't fit
        puts each parameter or argument on its own line with `)` alone on the last line. No
        array, dictionary or set literal, empty ones included, inside a call's arguments or a
        comparison in `#expect`: name it with `let` first (Package.swift is the exception). A
        switch case's body goes on the line below its label, and a case body of more than one
        statement moves into a named function. Every protocol conformance and generic
        constraint is listed with its reason in the comment above the type (the doc comment for
        public API). `let` by default: value types have only `let` fields, no `mutating`
        functions, no `lazy var`, no `inout` for the package's own types, no stored static or
        global `var`, and every remaining stored or local `var` has a comment above it that says
        "`var` because" and names what changes it.
    - path: "Sources/**/*.swift"
      instructions: >-
        Swift 6 language mode with strict concurrency. Code must build with Swift 6.0
        through the newest release, on iOS 13, macOS 10.15 and Linux. Flag: an API newer
        than the platform floor in Package.swift without an availability check; Swift 6.1+
        syntax or library API (6.2's @concurrent and nonisolated(nonsending), InlineArray,
        Span) not behind #if compiler(>=6.x); @unchecked Sendable
        or nonisolated(unsafe) without a comment naming the lock that guards the state;
        @preconcurrency on a conformance; a mutable global or static var; an unstructured Task
        where async let or a task group would do; a semaphore or other blocking wait on async
        work; a Task in deinit that captures self; @objc, #selector, KVO, NSClassFromString or
        other Objective-C runtime APIs (Linux has none); URLSession without importing
        FoundationNetworking under #if canImport(FoundationNetworking). Flag a breaking change
        to public API (removed, renamed, relabelled or retyped declaration, dropped Sendable,
        changed default argument, new protocol requirement without a default, new public enum
        case, changed isolation of a public async function) that CHANGELOG.md does not record
        as breaking. Raise a concurrency issue only with a realistic sequence that triggers it.
        Clean code, each as an inline should-fix finding (major severity), never a nitpick: a
        function longer than about 40 lines, or nested more
        than three levels deep, that reads better split into named functions; a name that
        doesn't say what it holds or does (abbreviations, single letters outside a short
        closure or loop, vague words such as data, info, helper, manager, util, temp or flag);
        the same logic written twice where one named function or type would serve both; a
        boolean or bare literal argument whose meaning isn't clear at the call site; dead code,
        commented-out code, and a number or string that needs a named constant. Raise each only
        when the fix is concrete; don't flag a long function whose length is one flat list (a
        table of cases or diagnostics). Do not flag: missing Sendable on actors or global-actor
        types; a sending parameter; nonisolated on a member that reads only let state; a missing
        @MainActor (nonisolated is the right library default); @unchecked Sendable on a type
        whose mutable state is behind a lock named in a comment; a lock taken by hand instead of
        NSLock.withLock (that needs iOS 17); a plain import Foundation.
    - path: "Sources/*Macros/**/*.swift"
      instructions: >-
        swift-syntax macro implementation. Flag fatalError, preconditionFailure, try! or
        force-unwraps on the user's syntax; emit a Diagnostic with a clear message that says
        what to do instead, plus a FixIt when the correction is mechanical. Flag generated code
        that names types without qualification where user code could shadow them (write
        Swift.Int and Understudy.Spy, not Int or Spy). Flag an attached macro whose names: list
        misses a member it generates. Flag generated code a person wouldn't write by hand: the
        code a macro writes reads like a double written by hand. Flag swift-syntax APIs newer
        than the lowest swift-syntax Package.swift allows that are not behind
        #if canImport(SwiftSyntaxNNN). A change in what a public macro generates is a public
        API change. Braces and spacing inside the code strings a macro emits follow what the
        expansion needs, not the source style.
    - path: "Tests/**/*.swift"
      instructions: >-
        Report each broken rule in this block as an inline should-fix finding (major
        severity), never as a nitpick. Swift Testing only (import Testing, no XCTest). Each test
        pins one promise the package
        makes to its user, is named after it and reaches the code only the way that user does:
        the public API, or the compiler by using a macro in source. Every @Test has a display
        name that states its promise as a plain sentence in sentence case with no full stop,
        such as @Test("A spy keeps every input in order"), with arguments after it; flag a name
        that says what the test does instead of what is true, or that promises more or less
        than its checks show. Flag a test that checks private state or internal order, counts
        or timing; that sleeps to wait for an event instead of awaiting it or using
        confirmation; that repeats another test's promise (merge them); or that @testable
        imports a module. Macro tests: the macro test targets expand source in process and check
        what a person sees, which is allowed and wanted: the diagnostics (message, line, column,
        fix-its and the code a fix-it gives), and the parts of an expansion the compiler can't
        show in a running test (a stop message, the generated initializer's parameters, the
        access level, the #if DEBUG wrapper, a member that must not exist). Flag a check on
        anything else in the expanded text, and never suggest assertMacroExpansion,
        expandedSource or comparing a whole expansion to expected text: the package tests
        macros by behaviour on purpose, and how a generated double behaves is tested where the
        compiler builds it. Flag a force-unwrap where try #require belongs, and Swift Testing
        API newer than Swift 6.0 not behind #if compiler(>=6.x): exit tests, attachments, a
        range expectedCount in confirmation, the error returned by #expect(throws:), issue
        severity and Test.cancel. Do not flag: a test that checks a spy's calls, call count or
        call order (that is the spy's public promise); @unchecked Sendable on a lock-protected
        spy; @MainActor on a test; .serialized on a suite that shares state; withKnownIssue
        that gives a reason; source fixtures in string literals written the way a user writes
        a double, such as `{ @Spied get {} }`.
    - path: "Package.swift"
      instructions: >-
        Flag: swift-tools-version above 6.0; swiftLanguageVersions instead of
        swiftLanguageModes; a raised platform minimum (semver-major); defaultIsolation or
        any other Swift 6.2-only setting; unsafeFlags; exact, branch or revision dependency
        requirements; a swift-syntax range narrower than before or narrower than the majors
        the supported toolchains ship; a new dependency.
    # Every file type that isn't Swift has an entry of its own below. A probe pull request
    # showed that without one, CodeRabbit posted only the worst findings in a file and dropped
    # findings such as eval of file contents and a hard-coded password.
    - path: ".github/workflows/**"
      instructions: >-
        Actions are pinned to a full commit SHA with the version in a comment, images to a
        digest, each job gets only the permissions it uses, no checkout keeps the token, and
        only free GitHub-hosted runners are used. A download follows HTTPS only and is checked
        against a checksum. Report each security problem as an inline should-fix finding (major
        severity), even where zizmor in CI may also report it, since CI's workflow lint runs
        only after the SonarQube Cloud gate passes: pull_request_target or workflow_run that
        checks out or runs the pull request's code; an expression from the event (a title,
        body, branch name, commit message or label) expanded straight inside run: instead of
        through env:; permissions: write-all or a write permission the job doesn't use; an
        action pinned to a tag or branch; a checkout without persist-credentials: false; a
        self-hosted runner; a secret passed to a step that doesn't need it. Flag a change that
        drops the Swift 6.0 (lowest versions) or Swift 6.4 job from pull requests, drops Swift
        6.1 to 6.3 from the run on main and before a release, renames a job that is a required
        check (SonarQube Cloud quality gate, Linux checks / Linux build and tests, Branch name,
        Release / Release check, CodeRabbit), or lets a job in checks.yml start before the
        SonarQube Cloud quality gate passed. Flag a new pinned commit of
        codecov/codecov-action: the org's Actions policy allows exactly one commit, so the PR
        must say the allow list was updated too. Don't repeat actionlint's syntax and
        expression-type findings: CI runs it.
    - path: "**/*.{yml,yaml}"
      instructions: >-
        Settings files: Dependabot (.github/dependabot.yml), Codecov (codecov.yml), the Swift
        Package Index (.spi.yml), CodeRabbit (.coderabbit.yaml) and the workflows. Each opens
        with a comment that says what the file is for and why each choice was made; flag a
        changed setting whose comment no longer matches it. Flag a key the tool's schema
        doesn't have or a value of the wrong type, since these tools often ignore an unknown
        key without an error. Flag a change that adds anything paid, that turns on a pull
        request comment or annotation from Codecov (CodeRabbit's review is the one set of
        comments on a PR), or that lowers Codecov's patch target or project threshold.
    - path: ".coderabbit.yaml"
      instructions: >-
        Check every key against the schema in the first line (schema.v2.json). Flag a change
        that turns on high_level_summary, a finishing touch, automatic approvals, the poem,
        issue enrichment or anything else that writes commits, edits the PR description or
        comments on issues; that drops a file type's path instructions; that removes a path
        from review without saying why it can't be reviewed by reading; or that turns off a
        linter without naming the CI job that runs it instead.
    - path: "sonar-project.properties"
      instructions: >-
        Flag a change that moves test code into sonar.sources or package code into
        sonar.tests, that excludes a file or a rule to make an issue go away instead of fixing
        it (an exclusion needs a comment that says why the rule doesn't apply), or that drops
        a language folder (scripts, .github, Tools, Benchmarks) from the analysis.
    - path: "**/*.sh"
      instructions: >-
        Bash scripts, run on Linux CI with no Mac. Report each broken rule as an inline
        should-fix finding (major severity), and post every ShellCheck finding of warning or
        error level inline. The file starts with #!/usr/bin/env bash, the file header (file
        name, Understudy, "Created by Yousef Mohamed" and the MIT copyright line), a comment
        that says what the script does and how to run it, and set -euo pipefail. Flag GNU-only
        or BSD-only flags where the script may also run on a Mac, unquoted expansions, eval or
        bash -c on an argument or other outside input, rm -rf on a variable not checked to be
        non-empty (use "${dir:?}"), cd without a check, a loop over ls output, backticks
        instead of $( ), a download that doesn't use HTTPS and a pinned checksum, a temporary
        file not made with mktemp, an error message not sent to stderr, and an exit status
        that hides a failure. Flag a change that weakens the coverage gate (any line of
        Sources/ that no test runs must still fail it), the size limits in
        scripts/check-structure.py or the generated-code budget.
    - path: "**/*.py"
      instructions: >-
        Python 3 scripts that use only the standard library and run with python3 -I on the
        CI runner's Python. Report each broken rule as an inline should-fix finding (major
        severity), never as a nitpick, and post every Ruff finding inline. The file starts with
        #!/usr/bin/env python3, the file header (file name, Understudy, "Created by Yousef
        Mohamed" and the MIT copyright line) and a module docstring that says what the script
        does, why and how to run it. Flag: a third-party import; eval, exec or pickle on any
        input; subprocess with shell=True, os.system or a command built by joining strings
        (pass a list); a subprocess call whose failure is ignored (use check=True or read the
        return code); a bare except or an except that swallows the error; a file opened
        without with, or read or written without encoding="utf-8"; a mutable default
        argument; == None or != None; unused imports and several imports on one line; a
        hard-coded password, token or key; os.path where pathlib reads better; a script that
        exits 0 after a failure or
        prints an error to stdout instead of stderr; code at module level instead of in a
        main() called under if __name__ == "__main__"; a function longer than about 40 lines
        or a name that doesn't say what it holds. Comment and docstring lines end by column
        100, code lines by 120.
    - path: "Benchmarks/generated-code-budget.txt"
      instructions: >-
        The amount of code the macros write, enforced by scripts/check-generated-code.sh. Flag
        a raised count unless the PR description says why the macros now write more and that
        it was measured with scripts/compare-expansions.sh.
    - path: "**/*.md"
      instructions: >-
        Docs for package users and contributors, in plain short English. Flag: a fact the PR
        changes in code, a workflow or a script that this doc still states the old way; a fact
        stated here that has another home (CODE_STYLE.md for code style, the script or
        workflow for a limit or a rule), instead of a link to it; a relative link or anchor
        that points to a file or heading that doesn't exist; a code sample that uses API the
        package doesn't have or wouldn't build; a mention of a private repo, a plan, a
        decision or an issue number; a heading level that skips a level.
    - path: "CHANGELOG.md"
      instructions: >-
        Keep a Changelog format. New user-facing changes go under Unreleased, in plain words
        a package user understands; breaking changes say they are breaking.
  tools:
    # No SwiftLint config in this package; the profile-generated rules disagree with CODE_STYLE.md.
    swiftlint:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    # actionlint and zizmor run pinned in CI's required "Workflow lint" job; a second run here
    # would post the same findings again. yamllint's default line length disagrees with the
    # workflows, and actionlint already validates them.
    actionlint:
      enabled: false
    zizmor:
      enabled: false
    yamllint:
      enabled: false
    # CI's actionlint checks only the scripts inside workflows, so scripts/*.sh are checked here.
    shellcheck:
      enabled: true
    # Python scripts have no linter in CI, so Ruff runs here; the path instructions post its
    # findings inline. ast-grep and OpenGrep stay on by default and add security rules for both.
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true

chat:
  art: false
  auto_reply: true

knowledge_base:
  # The one home for the code style. Keep any AGENTS.md or CLAUDE.md consistent with it,
  # since CodeRabbit reads those by default too.
  code_guidelines:
    enabled: true
    filePatterns:
      - CODE_STYLE.md
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  automatic_linking_mode: disabled

# Issues and plans live in a private repo, so CodeRabbit leaves issues here alone.
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
