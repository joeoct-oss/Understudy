# Runs every check on a pull request to main and on a push to main, in stages: each stage starts
# only when the one before it passed, so a failure stops the run before it spends a SonarQube
# analysis, macOS time or a mutation run (Yousef, 2026-11-26).
# 1. "Fast checks", seconds long: actionlint, zizmor, the size limits, lint (swift-format and
#    SwiftLint, through scripts/lint.sh), dependency review when the package's dependencies
#    changed, and which kinds of files changed.
# 2. "SonarQube Cloud quality gate": scripts/sonar-scan.sh analyzes the code with the rules in
#    sonar-project.properties and waits for the gate (bugs, security, code quality, duplication
#    and reviewed hotspots on new code). Then the release check or publish (release.yml).
# 3. The Linux checks (ci.yml), on pull requests only, since on main the release workflow runs
#    them on the pushed commit before it publishes. They measure the coverage once; the Codecov
#    job below uploads it.
# 4. Once the Linux checks passed: the Apple platform checks (apple.yml), the benchmarks
#    (benchmarks.yml) and mutation testing of the changed sources (mutation.yml), all on pull
#    requests only.
# - A pull request that changes only Markdown files at the root or the LICENSE runs stages 1 and 2
#   and skips the tests: the Linux and Apple gates still report, so it can merge.
# - CodeRabbit and CodeQL are apps outside this workflow. CodeRabbit gates the merge itself: a
#   required check, its approval as the required review, and every thread resolved.
# - The branch name check stays in its own workflow: it runs no package code and is the same file
#   in every repo.
# - Drafts are skipped until they are ready for review. A newer push cancels the run still going
#   for the same PR. Runs on main are never cancelled.
# Hardening as in ci.yml: free GitHub-hosted runners only (Linux, and standard macOS for the Apple
# checks), actions pinned to a full commit SHA, no checkout keeps the token, and each job gets only
# the permissions its workflow uses.
name: Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    name: Fast checks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
    steps:
      # The base commit is fetched too, to list the files the pull request changes.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checks workflow syntax, expressions and, through the runner's shellcheck, every run script.
      # The download follows HTTPS only and is checked against its checksum.
      - name: actionlint
        env:
          VERSION: 1.7.9
          SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Checks for security mistakes: unpinned actions and images, broad permissions, script
      # injection, kept credentials and cache poisoning. Offline, so it needs no token.
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          VERSION: 1.33.1
          SHA256: 49eb92a95347e7da58c3123e4d5b297dbb6fe8ecc328e9db68df14c08e25e151
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==$VERSION --hash=sha256:$SHA256" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes \
            -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format=github .github/workflows

      # Fails on a file, a body or a line past the package's size limits (CODE_STYLE.md, "Where
      # code goes"). Python 3 is on the runner, so nothing is installed. It and the steps above run
      # even when one of them failed, so each failure is reported in the same run.
      - name: Size limits
        if: ${{ !cancelled() }}
        run: scripts/check-structure.py

      # Waypoint's CODE_STYLE.md, checked by swift-format and SwiftLint (scripts/lint.sh), as in
      # the cloud while working. swift-format runs in the Swift image the Linux checks pin, whose
      # `swift format` is the version scripts/lint-tools.sh expects. SwiftLint runs on the runner
      # host, where scripts/lint.sh installs the version scripts/lint-tools.sh pins, with its
      # sha256 checked: the Linux SwiftLint needs libxml2.so.2, which the image doesn't ship, and
      # reads the syntax its custom rules need through the host toolchain's SourceKit.
      - name: Lint
        if: ${{ !cancelled() }}
        env:
          IMAGE: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
        run: |
          docker run --rm --volume "$PWD:/package" --workdir /package "$IMAGE" \
            scripts/lint.sh --swift-format-only
          scripts/lint.sh --swiftlint-only

      # Docs-only: every file the pull request changes is a Markdown file at the root (README,
      # CHANGELOG, CODE_STYLE and the like) or the LICENSE, which no build or test reads. A rename
      # counts as a deletion and an addition, so a source file moved to Markdown isn't docs-only. A
      # push to main is never docs-only, so a release always runs every test.
      - name: Which files changed
        id: changes
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          if [[ -n "$BASE" ]]; then
            changed=$(git diff --no-renames --name-only "$BASE" HEAD)
            echo "Changed files:"
            echo "$changed"
            if [[ -n "$changed" ]] && ! grep -qvE '^([^/]+\.md|LICENSE)$' <<<"$changed"; then
              docs_only=true
            fi
          fi
          echo "Docs-only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

      # Fails a pull request that adds or bumps a dependency with a known vulnerability of moderate
      # severity or higher, from GitHub's advisory database. Only when Package.swift or
      # Package.resolved changed, since nothing else adds a dependency to users' builds.
      - name: Did the dependencies change
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        id: deps
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- Package.swift Package.resolved; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review the changed dependencies
        if: ${{ !cancelled() && steps.deps.outputs.changed == 'true' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  sonar:
    name: SonarQube Cloud quality gate
    needs: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The full history gives Sonar the blame data it needs to tell new code from old.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The scanner jar, checked against its checksum before use, so most runs download nothing.
      # Pull requests only, as with every cache here.
      - name: Restore the scanner
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sonar-scanner
          key: sonar-scanner-${{ hashFiles('scripts/sonar-scan.sh') }}

      - name: Analyze and wait for the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: scripts/sonar-scan.sh

  linux:
    name: Linux checks
    needs: [fast, sonar]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      docs-only: ${{ needs.fast.outputs.docs-only == 'true' }}

  # Uploads the coverage the Swift 6.4 Linux job measured, on a pull request (from the Linux
  # checks above) and on main (from the release workflow's Linux checks), once SonarQube passed, so
  # a draft or a run stopped early starts no upload. Codecov only reports the numbers;
  # scripts/check-coverage.sh in that job is the gate, so this never fails a run.
  codecov:
    name: Coverage to Codecov
    needs: [fast, sonar, linux, release]
    if: >-
      ${{ !cancelled() && needs.sonar.result == 'success' && needs.fast.outputs.docs-only != 'true'
      && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the report
        id: report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Upload to Codecov
        if: ${{ steps.report.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.lcov
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  apple:
    name: Apple platform checks
    needs: [fast, linux]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/apple.yml # zizmor: ignore[self-repository]
    with:
      docs-only: ${{ needs.fast.outputs.docs-only == 'true' }}

  benchmarks:
    name: Benchmarks
    needs: [fast, linux]
    if: github.event_name == 'pull_request' && needs.fast.outputs.docs-only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/benchmarks.yml # zizmor: ignore[self-repository]

  mutation:
    name: Mutation testing
    needs: [fast, linux]
    if: github.event_name == 'pull_request' && needs.fast.outputs.docs-only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/mutation.yml # zizmor: ignore[self-repository]

  # Two quick merges run the release check and publish one after the other, never at once, so a
  # check always sees the tags an earlier publish made. Pull requests get their own group.
  release:
    name: Release
    needs: sonar
    concurrency:
      group: release-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
