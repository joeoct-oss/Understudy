# Publishes a release when a merge to main brings a new version in CHANGELOG.md. This file is the
# one home for how Understudy is released. The checks workflow (checks.yml) calls it on pull
# requests and pushes to main once SonarQube Cloud's quality gate passed, so a failed gate
# publishes nothing.
# - A release PR moves the Unreleased notes under `## X.Y.Z - YYYY-MM-DD`. Its review and merge
#   are the approval: nothing is tagged or published by hand, and no Mac or browser is needed.
# - On a pull request (dry run): read-only. Shows the version and notes a merge would publish in
#   the job summary, and fails when the top version has no tag and isn't higher than the latest
#   tag.
# - On a push to main (publish): when the top version has no tag yet, creates the tag on the
#   pushed commit and the GitHub release with that version's notes, marked Latest. When it is
#   already tagged, does nothing. Publishing waits for the Linux checks (ci.yml) and the Apple
#   platform checks (apple.yml), which run again on the pushed commit: a squash merge makes a
#   commit no PR check saw, so nothing is tagged unless both passed on exactly that commit.
# Uses only actions/checkout (pinned to a commit SHA), the runner's gh and GITHUB_TOKEN, on free
# GitHub-hosted runners. Each job gets only the permissions it uses.
name: Release

on:
  workflow_call:

permissions: {}

jobs:
  # Runs on pull requests and on main. Read-only.
  check:
    name: Release check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      tagged: ${{ steps.changelog.outputs.tagged }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Read the newest version from the changelog
        id: changelog
        run: |
          version=$(scripts/release-notes.sh "$RUNNER_TEMP/notes.md")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/$version" > /dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "$version is already tagged. Nothing to publish."
            exit 0
          fi
          echo "tagged=false" >> "$GITHUB_OUTPUT"
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::error::CHANGELOG.md's newest version $version has no tag and isn't higher than the latest tag $latest."
            exit 1
          fi
          {
            echo "## Publishes $version"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Publishes $version on main, after ${latest:-no earlier tag}."

  # The full Linux checks on the pushed commit, on every push to main, so main is always tested.
  linux-checks:
    name: Linux checks
    if: github.event_name == 'push'
    permissions:
      contents: read
    # The documented local form: it always runs ci.yml from this same commit.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  # The Apple platform checks on the pushed commit, on every push to main, for the same reason.
  apple-checks:
    name: Apple platform checks
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/apple.yml # zizmor: ignore[self-repository]

  # Runs only on main, only when the check found an untagged version, and only after the Linux
  # and Apple checks passed on the same commit.
  publish:
    name: Publish
    needs: [check, linux-checks, apple-checks]
    if: github.event_name == 'push' && needs.check.outputs.tagged == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          scripts/release-notes.sh "$RUNNER_TEMP/notes.md" > /dev/null
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          echo "Published $VERSION: $(gh release view "$VERSION" --json url --jq .url)"
