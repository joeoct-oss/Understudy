# Builds and tests the package on Linux on pull requests to main.
# Runs on GitHub-hosted Linux runners, which are free for public repositories, in the official
# Swift container.
# - Draft pull requests are skipped; the check runs when a PR is ready for review and on every
#   push after that.
# - A newer push cancels the run still going for the same PR.
# Apple platforms are tested on the Mac.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The thread sanitizer turns off address randomisation with `personality`, which Docker's
    # default seccomp profile blocks, so the container runs without it.
    container:
      image: swift:6.2
      options: --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Builds with warnings as errors, runs every test, and fails on any line of the sources that
      # no test runs.
      - name: Test, with warnings as errors and every line covered
        run: scripts/check-coverage.sh -Xswiftc -warnings-as-errors

      - name: Test with the thread sanitizer
        run: swift test --sanitize=thread
