# Builds and tests the package on Linux. The release workflow calls it on every push to main and
# publishes only when it passes there, so it is the last check before a version goes out.
# - The checks workflow (checks.yml) calls it on pull requests to main once SonarQube Cloud's
#   quality gate passed; drafts are skipped until they are ready for review.
# - "Linux build and tests" is the one required check: it passes only when every job below passed.
# - Swift 6.4: warnings as errors, every line of Sources/ covered (scripts/check-coverage.sh), and
#   the thread sanitizer. The macro sources must be covered by the macro tests alone, so the gate
#   also proves the macro expansion tests ran.
# - Swift 6.1, 6.2 and 6.3: every test, warnings as errors, with the committed Package.resolved.
#   Only when the release workflow calls this one on a push to main, and on a manual run, never on
#   a pull request: a pull request tests the lowest and the newest version, which almost always
#   covers the ones in between, and main checks the rest before anything is published.
# - Lowest versions: Swift 6.0, the tools version in Package.swift, with the lowest swift-syntax
#   Package.swift allows (read from Package.swift, its one home).
# - Workflow lint: actionlint and zizmor over every workflow, and the size limits on the code
#   (scripts/check-structure.py).
# Hardening: free GitHub-hosted Linux runners only, no Mac. Every action is pinned to a full commit
# SHA and every image to a digest, with the version in a comment; Dependabot bumps the actions,
# and the images are bumped by hand in the same PR. Each job reads the repo and nothing else, and
# no checkout keeps the token. The build cache is used on pull requests only, so nothing a cache
# holds reaches a run that gates a release.
name: Linux checks

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  coverage:
    name: Tests, coverage and thread sanitizer (Swift 6.4)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # The thread sanitizer turns off address randomisation with `personality`, which Docker's
    # default seccomp profile blocks, so the container runs without it.
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
      options: --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.4.3-${{ hashFiles('Package.swift', 'Package.resolved') }}

      # Builds with warnings as errors, runs every test, and fails on any line of the sources that
      # no test runs.
      - name: Test, with warnings as errors and every line covered
        run: scripts/check-coverage.sh -Xswiftc -warnings-as-errors

      - name: Test with the thread sanitizer
        run: swift test --sanitize=thread

      # The code the macros write never varies from run to run, so its size is enforced: a change
      # updates Benchmarks/generated-code-budget.txt in the same pull request.
      - name: Generated code within its budget
        run: scripts/check-generated-code.sh

  swift:
    name: Tests on Swift ${{ matrix.swift }}
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            image: swift:6.1.3@sha256:6d5517e79420e85f3269422c4cc64c61a75ba5b1489565eea72f01f5be504780
          - swift: "6.2"
            image: swift:6.2.4@sha256:576698469fd3cf95b2abdeb91a7571d3afcd91806c87283dd01d564803554c0f
          - swift: "6.3"
            image: swift:6.3.3@sha256:4f42306306fe7e5a773a8d47d7e2a24dc3a975d1feb77996297ecfd7c329b1e9
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test, with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

  lowest:
    name: Lowest versions (Swift 6.0, lowest swift-syntax)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.0.3@sha256:e6aab687b7ec16a68abcf485c6bca8afd481e33fb9c8bd9e74e7abffded12bc4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: this job changes Package.resolved, so a cache would be keyed on the wrong file.
      - name: Resolve the lowest swift-syntax Package.swift allows
        run: |
          floor=$(sed -n 's|.*/swift-syntax", "\([0-9][0-9.]*\)"\.\.<.*|\1|p' Package.swift)
          if [[ -z "$floor" ]]; then
            echo "::error::Couldn't read swift-syntax's lowest version from Package.swift."
            exit 1
          fi
          swift package resolve
          swift package resolve swift-syntax --version "$floor"
          echo "Testing with swift-syntax $floor."

      - name: Test, with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

  lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks workflow syntax, expressions and, through the runner's shellcheck, every run script.
      # The download follows HTTPS only and is checked against its checksum.
      - name: actionlint
        env:
          VERSION: 1.7.9
          SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      # Checks for security mistakes: unpinned actions and images, broad permissions, script
      # injection, kept credentials and cache poisoning. Offline, so it needs no token.
      - name: zizmor
        env:
          VERSION: 1.33.1
          SHA256: 49eb92a95347e7da58c3123e4d5b297dbb6fe8ecc328e9db68df14c08e25e151
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          echo "zizmor==$VERSION --hash=sha256:$SHA256" > "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes \
            -r "$RUNNER_TEMP/zizmor.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format=github .github/workflows

      # Fails on a file, a body or a line past the package's size limits (CODE_STYLE.md, "Where
      # code goes"). Python 3 is on the runner, so nothing is installed. It runs last, and even
      # when a workflow check failed, so each failure is reported in the same run.
      - name: Size limits
        if: ${{ !cancelled() }}
        run: scripts/check-structure.py

  gate:
    name: Linux build and tests
    needs: [coverage, swift, lowest, lint]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A pull request skips the middle Swift versions on purpose, so their job isn't counted there.
      - name: Check that every job passed
        env:
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          PR_RESULTS: ${{ needs.coverage.result }} ${{ needs.lowest.result }} ${{ needs.lint.result }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            RESULTS="$PR_RESULTS"
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A Linux check didn't pass: $RESULTS."
              exit 1
            fi
          done
