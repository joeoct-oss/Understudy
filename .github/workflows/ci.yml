# Builds and tests the package on Linux. The release workflow calls it on every push to main and
# publishes only when it passes there, so it is the last check before a version goes out.
# - The checks workflow (checks.yml) calls it on pull requests to main once its fast checks and
#   SonarQube Cloud's quality gate passed; drafts are skipped until they are ready for review. A
#   pull request that needs none of these checks (skip-tests input, decided by scripts/ci-legs.py,
#   the one home of the skip rules) skips every job, and the gate reports a pass.
# - "Linux build and tests" is this workflow's one required check: it passes only when every job
#   below passed.
# - Swift 6.4: warnings as errors and every line of Sources/ covered (scripts/check-coverage.sh),
#   with the thread sanitizer in its own job beside it. The macro sources must be covered by the
#   macro tests alone, so the gate also proves the macro expansion tests ran. The measured lines
#   are kept as the "coverage" artifact, which the checks workflow uploads to Codecov, so coverage
#   is measured once per run.
# - Generated code budget: the size of the code the macros write, in its own job beside the
#   coverage job, since it builds a tool of its own and was the longest step after the tests on
#   the path every later check waits for (Yousef, 2026-11-27).
# - Swift 6.1, 6.2 and 6.3: every test, warnings as errors, with the committed Package.resolved.
#   Only when the release workflow calls this one on a push to main, and on a manual run, never on
#   a pull request: a pull request tests the lowest and the newest version, which almost always
#   covers the ones in between, and main checks the rest before anything is published.
# - Lowest versions: Swift 6.0, the tools version in Package.swift, with the lowest swift-syntax
#   Package.swift allows (read from Package.swift, its one home).
# - Swift 5 language mode: the package's tests built as a Swift 5 mode project builds them
#   (Swift5Mode/Package.swift), since the code the macros write compiles in the user's mode.
# - Public API kept: the Understudy library's public API against the latest released version, so
#   a change that would break a user's code fails here. A deliberate break belongs in a new major
#   version: list each one, as the job prints it, in .github/api-breakage-allowlist.txt, and
#   delete that file once the major version is released and becomes the new baseline.
# - Docs build: the DocC catalog (Sources/Understudy/Understudy.docc) and the API docs, with
#   warnings as errors (scripts/build-docs.sh). The fast checks compare the catalog's examples
#   with the guide tests (scripts/check-doc-examples.py), which the coverage job runs.
# - Workflow lint and the size limits run in the checks workflow's fast checks, before this one.
# Hardening: free GitHub-hosted Linux runners only; the Apple checks (apple.yml) have the macOS
# jobs. Every action is pinned to a full commit SHA and every image to a digest, with the version in
# a comment; Dependabot bumps the actions, and the images are bumped by hand in the same PR. Each
# job reads the repo and nothing else, and no checkout keeps the token. The build cache is used on
# pull requests only, so nothing a cache holds reaches a run that gates a release. The build cache
# workflow (cache.yml) fills it from main, so a new pull request's first run starts warm.
name: Linux checks

on:
  workflow_call:
    inputs:
      skip-tests:
        description: Nothing these checks read changed since they passed, so every job is skipped
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

jobs:
  coverage:
    name: Tests and coverage (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.4.3-${{ hashFiles('Package.swift', 'Package.resolved') }}

      # Builds with warnings as errors, runs every test, and fails on any line of the sources that
      # no test runs.
      - name: Test, with warnings as errors and every line covered
        env:
          COVERAGE_LCOV: coverage.lcov
        run: scripts/check-coverage.sh -Xswiftc -warnings-as-errors

      # Only feeds the Codecov report, so a failed upload never fails the job or skips the checks
      # after it.
      - name: Keep the coverage report
        if: ${{ !cancelled() && hashFiles('coverage.lcov') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.lcov
          retention-days: 1

  budget:
    name: Generated code budget (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the tool the check builds (scripts/compare-expansions.sh), which shares nothing with
      # the package's own build.
      - name: Restore the build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/expansion-record
          key: swift-6.4.3-expansion-${{ hashFiles('Package.resolved', 'Tools/ExpansionRecord/Package.swift') }}

      # The code the macros write never varies from run to run, so its size is enforced: a change
      # updates Benchmarks/generated-code-budget.txt in the same pull request.
      - name: Generated code within its budget
        run: scripts/check-generated-code.sh

  # Its own job, beside the coverage job, since it rebuilds everything with the sanitizer and was
  # the longest step on the path every later check waits for.
  tsan:
    name: Thread sanitizer (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # The thread sanitizer turns off address randomisation with `personality`, which Docker's
    # default seccomp profile blocks, so the container runs without it.
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
      options: --security-opt seccomp=unconfined
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its own key: a sanitizer build shares nothing with the coverage job's build.
      - name: Restore the build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.4.3-tsan-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Test with the thread sanitizer
        run: swift test --sanitize=thread

  swift:
    name: Tests on Swift ${{ matrix.swift }}
    if: ${{ github.event_name != 'pull_request' && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            image: swift:6.1.3@sha256:6d5517e79420e85f3269422c4cc64c61a75ba5b1489565eea72f01f5be504780
          - swift: "6.2"
            image: swift:6.2.4@sha256:576698469fd3cf95b2abdeb91a7571d3afcd91806c87283dd01d564803554c0f
          - swift: "6.3"
            image: swift:6.3.3@sha256:4f42306306fe7e5a773a8d47d7e2a24dc3a975d1feb77996297ecfd7c329b1e9
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test, with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

  lowest:
    name: Lowest versions (Swift 6.0, lowest swift-syntax)
    if: ${{ !github.event.pull_request.draft && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.0.3@sha256:e6aab687b7ec16a68abcf485c6bca8afd481e33fb9c8bd9e74e7abffded12bc4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: this job changes Package.resolved, so a cache would be keyed on the wrong file.
      - name: Resolve the lowest swift-syntax Package.swift allows
        run: |
          floor=$(sed -n 's|.*/swift-syntax", "\([0-9][0-9.]*\)"\.\.<.*|\1|p' Package.swift)
          if [[ -z "$floor" ]]; then
            echo "::error::Couldn't read swift-syntax's lowest version from Package.swift."
            exit 1
          fi
          swift package resolve
          swift package resolve swift-syntax --version "$floor"
          echo "Testing with swift-syntax $floor."

      - name: Test, with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

  swift5:
    name: Swift 5 language mode (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Swift5Mode package builds the package's own tests in Swift 5 language mode, with the
      # package's pins, so the code the macros write is proved in a Swift 5 mode project.
      - name: Test in Swift 5 language mode, with warnings as errors
        run: |
          cp Package.resolved Swift5Mode/
          swift test --package-path Swift5Mode --force-resolved-versions -Xswiftc -warnings-as-errors


  api:
    name: Public API kept (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
    steps:
      # The tags are needed to find the latest release, and its commit to build it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # Builds the latest released version and this one, and compares the public declarations of
      # the Understudy library, the one product users import. Only plain X.Y.Z tags count as
      # releases, so a prerelease tag never becomes the baseline. The breaks a new major version
      # makes on purpose are listed in the allowlist, when there is one.
      - name: Compare the public API with the latest release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          latest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [[ -z "$latest" ]]; then
            echo "::error::No release tag to compare with."
            exit 1
          fi
          echo "Comparing with $latest"
          allowlist=.github/api-breakage-allowlist.txt
          if [[ -f "$allowlist" ]]; then
            swift package diagnose-api-breaking-changes "$latest" --products Understudy \
              --breakage-allowlist-path "$allowlist"
          else
            swift package diagnose-api-breaking-changes "$latest" --products Understudy
          fi

  docs:
    name: Docs build (Swift 6.4)
    if: ${{ !github.event.pull_request.draft && !inputs.skip-tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: swift:6.4.3@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The DocC catalog and the API docs, with warnings as errors, so a broken link or tutorial
      # directive fails here instead of on the Swift Package Index.
      - name: Build the docs, with warnings as errors
        run: scripts/build-docs.sh

  gate:
    name: Linux build and tests
    needs: [coverage, budget, tsan, swift, lowest, swift5, api, docs]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A pull request skips the middle Swift versions on purpose, so their job isn't counted there.
      # A change these checks don't read skips every job on purpose, so it passes.
      - name: Check that every job passed
        env:
          EVENT: ${{ github.event_name }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          PR_RESULTS: >-
            ${{ needs.coverage.result }} ${{ needs.budget.result }} ${{ needs.tsan.result }}
            ${{ needs.lowest.result }}
            ${{ needs.swift5.result }} ${{ needs.api.result }} ${{ needs.docs.result }}
        run: |
          if [[ "$SKIP_TESTS" == "true" ]]; then
            echo "No file these checks read changed since they last passed, so they were skipped."
            exit 0
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            RESULTS="$PR_RESULTS"
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A Linux check didn't pass: $RESULTS."
              exit 1
            fi
          done
