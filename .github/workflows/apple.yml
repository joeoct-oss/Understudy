# Builds and tests the package with Apple's toolchain, on GitHub's standard macOS runners, which
# are free for a public repo. The Linux checks (ci.yml) can't see Apple's availability rules or an
# error only Xcode's compiler makes, and the code the macros write compiles in users' Apple test
# targets, so these jobs check it there.
# - The checks workflow (checks.yml) calls it on pull requests to main once the Linux checks
#   passed, so no macOS time goes to a change that already fails on Linux; drafts are skipped until
#   they are ready for review. A docs-only pull request (docs-only input) skips every job, and the
#   gate reports a pass. The release workflow (release.yml) calls it on every push to main, after
#   the Linux checks, and publishes only when it passes there.
# - "Apple builds and tests" is its one gate: it passes only when every job below passed.
# - Newest Xcode: every test on macOS, warnings as errors, with the committed Package.resolved.
# - iOS simulator: the package's tests (ApplePlatforms/Package.swift) run on an iOS simulator from
#   the runner with the newest Xcode, so the behaviour is proved on iOS and not only the build. Its
#   own job beside the macOS one, since the two builds in one job, one after the other, were the
#   longest job of the run (Yousef, 2026-11-27).
# - Oldest Xcode: Xcode 16.0, the first with Swift 6.0, the tools version in Package.swift, and
#   the lowest swift-syntax Package.swift allows, as the Linux lowest versions job does.
# - CodeQL's Swift scan runs in the oldest Xcode job, after its tests, so it takes no macOS job of
#   its own (Yousef, 2026-11-27). CodeQL reads Swift only on macOS and only the code it sees
#   compiled, so it builds the package's own targets again under its build tracer, in a separate
#   build folder (the tracer has to see a fresh build), with the security-extended queries. Swift
#   6.0 is inside the versions CodeQL supports (5.4 to 6.3). It adds about 17 minutes: about 8 for
#   the tracer to start on macOS and the rest to compile swift-syntax under it, which neither
#   SwiftPM's prebuilt swift-syntax nor building it before CodeQL starts avoided (PR #97). The main
#   ruleset's code scanning rule reads the result, so a pull request with a new Swift security alert
#   of high severity or higher, or a CodeQL error, can't merge. codeql.yml scans the workflows and
#   the Python scripts.
# - Lowest platform versions: the package's tests (ApplePlatforms/Package.swift) built for iOS 13,
#   tvOS 13, watchOS 6 and visionOS 1 with Xcode 16.4, so an API newer than a platform's floor
#   fails here. Xcode 16 deploys back to iOS 12, so each floor is built as declared, and 16.4 is
#   the Xcode 16 whose platforms the macos-15 runner has installed. Built only: running them needs a
#   simulator of that version, which the runners don't have. iOS and visionOS share one job, and
#   tvOS and watchOS another, so a run uses 5 macOS jobs, as many as a free plan runs at once.
# Hardening as in ci.yml: standard GitHub-hosted runners only, never a larger runner (those are
# billed) and no self-hosted Mac. Every action is pinned to a full commit SHA with the version in a
# comment, each job reads the repo and nothing else, and no checkout keeps the token. Runner
# labels and Xcode versions are pinned and bumped by hand. No build cache, so nothing a cache holds
# reaches a run that gates a release.
name: Apple platform checks

on:
  workflow_call:
    inputs:
      docs-only:
        description: The change touches only docs no build reads, so every job is skipped
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

jobs:
  macos:
    name: Tests on macOS (Xcode 26.6)
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test, with warnings as errors
        run: |
          swift --version
          swift test -Xswiftc -warnings-as-errors

  # Its own job, not a matrix entry beside the newest Xcode, so only this job gets the permission
  # to upload code scanning results.
  macos-lowest:
    name: Tests on macOS (Xcode 16.0)
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the lowest swift-syntax Package.swift allows
        run: |
          floor=$(sed -n 's|.*/swift-syntax", "\([0-9][0-9.]*\)"\.\.<.*|\1|p' Package.swift)
          if [[ -z "$floor" ]]; then
            echo "::error::Couldn't read swift-syntax's lowest version from Package.swift."
            exit 1
          fi
          swift package resolve
          swift package resolve swift-syntax --version "$floor"
          echo "Testing with swift-syntax $floor."

      - name: Test, with warnings as errors
        run: |
          swift --version
          swift test -Xswiftc -warnings-as-errors

      - name: Set up CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build the package for CodeQL
        run: swift build --force-resolved-versions --scratch-path .build-codeql

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:swift

  ios:
    name: Tests on an iOS simulator (Xcode 26.6)
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The first available iPhone simulator of the newest iOS the runner has. No signing: the
      # simulator runs unsigned test bundles. Warnings as errors aren't set, for the reason given
      # at the floor builds below.
      - name: Test on an iOS simulator
        working-directory: ApplePlatforms
        run: |
          cp ../Package.resolved .
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(n) for n in r.rsplit(".iOS-", 1)[1].split("-")])
          phones = [d for r in reversed(ios) for d in runtimes[r] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")
          ')
          if [[ -z "$device" ]]; then
            echo "::error::The runner has no available iPhone simulator."
            exit 1
          fi
          xcrun simctl list devices | grep "$device"
          xcodebuild test \
            -scheme ApplePlatforms-Package \
            -destination "id=$device" \
            -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO

  platforms:
    name: Builds for ${{ matrix.platforms }} at the lowest versions
    if: ${{ !github.event.pull_request.draft && !inputs.docs-only }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platforms: [iOS visionOS, tvOS watchOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ApplePlatforms/Package.swift repeats the package's platforms, since a package can't read
      # another's. This fails when the two lists differ.
      - name: Same platforms as the package
        run: |
          read_platforms() { sed -n '/platforms: \[/,/\],/p' "$1"; }
          if ! diff <(read_platforms Package.swift) <(read_platforms ApplePlatforms/Package.swift); then
            echo "::error::ApplePlatforms/Package.swift's platforms differ from Package.swift's."
            exit 1
          fi

      # A generic device destination builds for the lowest version each platform declares. No
      # signing: nothing is installed or run. Xcode names the package's one scheme
      # "ApplePlatforms-Package". An API newer than the floor is an error on its own; warnings as
      # errors can't be set here, since Xcode would pass it to swift-syntax, which builds with
      # warnings suppressed, and the macOS jobs already fail on any warning.
      - name: Build the tests
        env:
          PLATFORMS: ${{ matrix.platforms }}
        working-directory: ApplePlatforms
        run: |
          cp ../Package.resolved .
          xcodebuild -version
          for platform in $PLATFORMS; do
            echo "::group::Build for $platform"
            xcodebuild build-for-testing \
              -scheme ApplePlatforms-Package \
              -destination "generic/platform=$platform" \
              -skipMacroValidation \
              -onlyUsePackageVersionsFromResolvedFile \
              CODE_SIGNING_ALLOWED=NO
            echo "::endgroup::"
          done

  gate:
    name: Apple builds and tests
    needs: [macos, macos-lowest, ios, platforms]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A docs-only change skips every job on purpose, so it passes.
      - name: Check that every job passed
        env:
          DOCS_ONLY: ${{ inputs.docs-only }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Docs-only change: no build reads these files, so the checks were skipped."
            exit 0
          fi
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::An Apple check didn't pass: $RESULTS."
              exit 1
            fi
          done
