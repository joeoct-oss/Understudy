# Scans the workflows and the Python scripts with CodeQL, with the security-extended queries
# (Yousef, 2026-11-27). The main ruleset's code scanning rule reads the results, so a pull request
# with a new security alert of high severity or higher, or any CodeQL error, can't merge. Copilot
# Autofix suggests fixes on the alerts.
# - Replaces GitHub's managed default setup, which can't be given a build command: it built
#   Tools/ExpansionRecord instead of the package and scanned 3 of 76 Swift files.
# - Actions and Python need no build, so they run on Linux with build-mode none, on every pull
#   request to main (drafts too, so the gate has results by the time one is ready), on pushes to
#   main, and on Mondays at 6:00 AM Cairo time for queries added since the last push (cron
#   reads UTC, so 04:00 UTC; 7:00 AM in Cairo during Egypt's summer time).
# - The Swift in Sources/ is scanned in the oldest Xcode job of the Apple platform checks, since
#   CodeQL reads Swift only on macOS and that job already has a macOS runner (Yousef, 2026-11-27).
#   apple.yml says when it runs.
# Hardening as in ci.yml: free GitHub-hosted runners, actions pinned to a full commit SHA, the
# checkout keeps no token, and each job gets only the permissions it uses.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

# A newer push to a pull request cancels the scan still running for it.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}

