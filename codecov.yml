# Codecov reports the coverage that CI measures; scripts/check-coverage.sh in ci.yml is the gate.
# - Statuses only, no pull request comment or line annotations: the AI reviews (CodeRabbit,
#   and Gitar on trial) are the only comments on a PR.
# - Coverage never drops: the project status fails on any drop from the base commit, and the
#   patch status asks every changed line of Sources/ to be covered, as the gate does. The project
#   status keeps Codecov's default handling of removed lines: with every line covered, removing
#   lines can't lower the coverage, and `removed_code_behavior: off` (read as `false`) came with a
#   project status that Codecov never posted.
# - Neither status is a required check; they show the numbers next to the gate.
comment: false
github_checks:
  annotations: false
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 100%
