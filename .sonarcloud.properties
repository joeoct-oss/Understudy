# Settings for SonarQube Cloud's automatic analysis (free plan, no workflow or token).
# - Sources and tests are kept apart, so the clean-code rules check the package's code, and the
#   tests are judged by their own rules and by review (CODE_STYLE.md).
# - Coverage lives in Codecov and in CI's gate (scripts/check-coverage.sh). Automatic analysis
#   can't import it, so no file counts toward Sonar's coverage and it never reports 0%.
sonar.sources=Sources,Package.swift,scripts,.github
sonar.tests=Tests
sonar.coverage.exclusions=**/*
